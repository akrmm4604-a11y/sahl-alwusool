<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سهل الوصول - دليل القيارة والموصل</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; direction: rtl; text-align: right; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; }
        p { color: #555; text-align: center; }
        .card { background: #eef2f3; padding: 15px; margin: 15px 0; border-radius: 8px; border-right: 5px solid #3498db; }
        .footer { text-align: center; margin-top: 20px; font-size: 12px; color: #888; }
    </style>
</head>
<body>
    <div class="container">
        <h1>سهل الوصول</h1>
        <p>دليلك المحلي الشامل في القيارة والموصل</p>
        
        <div class="card">
            <h3>🛍️ المحلات والأسواق التجارية</h3>
            <p>استعرض متاجر الألبسة، محلات الكوزمتك، والمطاعم المحلية بكل سهولة.</p>
        </div>

        <div class="card">
            <h3>🏡 المشاريع المنزلية النسائية</h3>
            <p>منصة مخصصة لدعم وتسويق منتجات الأعمال المنزلية والمشاريع الصغيرة.</p>
        </div>

        <div class="footer">
            <p>جميع الحقوق محفوظة © سهل الوصول 2026</p>
        </div>
    </div>
</body>
</html>
