<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>تطبيق سهل الوصول - الدليل المحلي الشامل في القيارة والموصل</title>
    <meta name="theme-color" content="#ff5a00">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --brand-orange: #ff5a00;
            --brand-orange-dark: #e64a00;
            --brand-purple: #6b21a8;
            --page-bg: #ffffff;
            --card-bg: #ffffff;
            --text-main: #111827;
            --text-sub: #4b5563;
            --border-soft: #e5e7eb;
            --success-green: #16a34a;
            --danger-red: #dc2626;
            --vip-gold: #d97706;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--page-bg);
            color: var(--text-main);
            margin: 0;
            padding: 0 0 76px 0;
            direction: rtl;
            text-align: right;
            min-height: 100vh;
        }

        body.modal-open-scroll-lock {
            overflow: hidden !important;
            touch-action: none;
        }

        .container {
            max-width: 640px;
            margin: auto;
            background: var(--page-bg);
            min-height: 100vh;
        }

        .top-tabs-bar {
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px 0;
            border-bottom: 1px solid var(--border-soft);
            position: sticky;
            top: 0;
            z-index: 120;
            gap: 6px;
        }

        .top-tab-item {
            flex: 1;
            text-align: center;
            padding: 8px 4px 10px;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-sub);
            cursor: pointer;
            border-bottom: 3px solid transparent;
            white-space: nowrap;
        }

        .top-tab-item.active {
            color: var(--brand-orange-dark);
            font-weight: 800;
            border-bottom-color: var(--brand-orange);
        }

        .status-strip {
            margin: 8px 12px 0;
            padding: 7px 11px;
            border-radius: 10px;
            background: #fff7ed;
            border: 1px solid #fed7aa;
            color: #9a3412;
            font-size: 11.5px;
            font-weight: 700;
        }

        .search-section {
            background: #ffffff;
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-soft);
        }

        .search-box-frame {
            display: flex;
            align-items: center;
            border: 2px solid var(--brand-orange);
            border-radius: 14px;
            background: #ffffff;
            padding: 3px 3px 3px 10px;
            gap: 8px;
        }

        .search-go-btn {
            background: linear-gradient(135deg, #ff7a00, #ff4d00);
            color: #ffffff;
            border: none;
            border-radius: 11px;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            font-family: inherit;
        }

        .search-input-field {
            flex: 1;
            border: none;
            outline: none;
            font-size: 12.5px;
            font-family: inherit;
            color: var(--text-main);
            background: transparent;
            min-width: 0;
        }

        .search-quick-icons {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .categories-strip {
            display: flex;
            gap: 7px;
            padding: 8px 12px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .categories-strip::-webkit-scrollbar {
            display: none;
        }

        .cat-chip {
            background: #f9fafb;
            border: 1px solid var(--border-soft);
            border-radius: 18px;
            padding: 6px 13px;
            font-size: 11.5px;
            font-weight: 700;
            color: var(--text-main);
            cursor: pointer;
            white-space: nowrap;
            font-family: inherit;
        }

        .cat-chip.active {
            background: var(--brand-orange);
            color: #ffffff;
            border-color: var(--brand-orange);
        }

        .cat-chip.home-chip {
            background: #faf5ff;
            color: var(--brand-purple);
            border-color: #e9d5ff;
        }

        .cat-chip.home-chip.active {
            background: var(--brand-purple);
            color: #ffffff;
            border-color: var(--brand-purple);
        }

        .utility-actions-bar {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            padding: 0 12px 10px;
        }

        .utility-btn {
            border-radius: 10px;
            padding: 9px 10px;
            font-size: 12px;
            cursor: pointer;
            text-align: center;
            font-family: inherit;
        }

        .utility-btn.primary-action {
            background: #fff7ed;
            border: 1px solid #fdba74;
            color: var(--brand-orange-dark);
            font-weight: 800;
        }

        .form-container {
            display: none;
            background: #ffffff;
            margin: 0 12px 14px;
            border-radius: 14px;
            padding: 16px 14px;
            border: 2px solid var(--brand-orange);
            box-shadow: 0 6px 18px rgba(255, 90, 0, 0.08);
        }

        .form-container .listing-field-label {
            font-size: 13.5px;
            font-weight: 800;
            color: var(--text-main);
            display: block;
            margin: 4px 0 6px 0;
        }

        .form-container input,
        .form-container select,
        .form-container textarea {
            width: 100%;
            min-height: 44px;
            padding: 10px 12px;
            margin-bottom: 11px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            font-size: 13.5px;
            font-weight: 600;
            font-family: inherit;
            background: #ffffff;
            color: var(--text-main);
        }

        .submit-btn {
            background: linear-gradient(135deg, #ff7a00, #ff4d00);
            color: #ffffff;
            border: none;
            border-radius: 11px;
            padding: 11px 14px;
            min-height: 46px;
            width: 100%;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            font-family: inherit;
        }

        .grid-two-col {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            padding: 0 12px 14px;
        }

        .grid-item-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-soft);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            display: flex;
            flex-direction: column;
        }

        .grid-item-card.vip-card {
            border-color: var(--vip-gold);
        }

        .grid-img-box {
            width: 100%;
            aspect-ratio: 1 / 1.05;
            background: #f3f4f6;
            overflow: hidden;
        }

        .grid-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .grid-card-body {
            padding: 8px 9px 10px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .grid-title {
            margin: 0 0 5px 0;
            font-size: 14.5px;
            font-weight: 900;
            color: #b91c1c;
            line-height: 1.3;
        }

        .grid-price {
            font-size: 12px;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .grid-meta {
            font-size: 10.5px;
            color: var(--text-sub);
            line-height: 1.35;
            margin-bottom: 6px;
        }

        .grid-actions {
            margin-top: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 4px;
            padding-top: 6px;
            border-top: 1px solid #f3f4f6;
        }

        .mini-like-btn {
            background: #fff7ed;
            border: 1px solid #fed7aa;
            color: var(--brand-orange-dark);
            border-radius: 7px;
            padding: 4px 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
        }

        .mini-order-btn {
            background: #ecfdf5;
            color: #15803d;
            border: 1px solid #bbf7d0;
            border-radius: 7px;
            padding: 4px 9px;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            font-family: inherit;
        }

        .bottom-nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #ffffff;
            border-top: 1px solid var(--border-soft);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 6px 4px;
            z-index: 200;
        }

        .bottom-nav-btn {
            background: transparent;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            font-size: 10.5px;
            font-weight: 700;
            color: var(--text-sub);
            cursor: pointer;
            padding: 3px 6px;
            font-family: inherit;
        }

        .bottom-nav-btn.active {
            color: var(--brand-orange);
            font-weight: 800;
        }

        .bottom-nav-icon {
            font-size: 18px;
            line-height: 1;
        }

        .footer {
            text-align: center;
            font-size: 11px;
            color: var(--text-sub);
            padding: 10px 12px 18px;
        }

        .custom-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            z-index: 2500;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        .custom-modal-content {
            background: #ffffff;
            color: var(--text-main);
            border: 1px solid var(--border-soft);
            width: 100%;
            max-width: 390px;
            border-radius: 14px;
            padding: 15px;
            max-height: 88vh;
            overflow-y: auto;
        }

        .toast-notice {
            display: none;
            position: fixed;
            bottom: 76px;
            left: 50%;
            transform: translateX(-50%);
            background: #111827;
            color: #ffffff;
            padding: 9px 14px;
            border-radius: 10px;
            font-size: 11.5px;
            font-weight: 700;
            z-index: 3500;
            max-width: 92%;
            text-align: center;
        }
    </style>
</head>

            window._toastT = setTimeout(() => { el.style.display = "none"; }, 3000);
        }

        function esc(str) {
            return String(str || "").replace(/[&<>"']/g, (m) => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
            }[m]));
        }

        function setModalOpen(modalEl, open) {
            if (!modalEl) return;
            modalEl.style.display = open ? "flex" : "none";
            const anyOpen = Array.from(document.querySelectorAll(".custom-modal")).some((m) => m.style.display === "flex");
            document.body.classList.toggle("modal-open-scroll-lock", anyOpen);
        }

        function setActiveCategoryChip(cat) {
            activeCat = cat;
            document.querySelectorAll(".cat-chip").forEach((chip) => {
                chip.classList.toggle("active", chip.dataset.cat === cat);
            });
            renderVendors();
        }

        function renderVendors() {
            const q = (document.getElementById("searchInput").value || "").trim().toLowerCase();
            const filtered = allItems.filter((item) => {
                if (!isAdmin && item.status && item.status !== "approved") return false;
                const catMatch = activeCat === "all" || item.category === activeCat;
                const qMatch = !q || `${item.name || ""} ${item.address || ""} ${item.category || ""} ${item.price || ""}`.toLowerCase().includes(q);
                return catMatch && qMatch;
            });

            vendorsList.innerHTML = "";
            if (!filtered.length) {
                vendorsList.innerHTML = '<p style="grid-column:1/-1; text-align:center; color:var(--text-sub); font-size:12px; padding:18px;">لا توجد محلات أو إعلانات مطابقة حالياً.</p>';
                return;
            }

            filtered.forEach((item) => {
                const card = document.createElement("div");
                card.className = "grid-item-card" + (item.vip ? " vip-card" : "");
                const imgUrl = item.image || (Array.isArray(item.images) && item.images[0]) || "https://akrmm4604-a11y.github.io/sahl-alwusool/1795103326267.jpg";
                card.innerHTML = `
                    <div class="grid-img-box">
                        <img src="${esc(imgUrl)}" alt="${esc(item.name)}" onerror="this.src='https://akrmm4604-a11y.github.io/sahl-alwusool/1795103326267.jpg'">
                    </div>
                    <div class="grid-card-body">
                        <h3 class="grid-title">${esc(item.name || "بدون اسم")}${item.vip ? " ⭐" : ""}</h3>
                        ${item.price ? `<div class="grid-price">${esc(item.price)}</div>` : ""}
                        <div class="grid-meta">${esc(item.category || "")}${item.address ? " • " + esc(item.address) : ""}</div>
                        <div class="grid-actions">
                            <button type="button" class="mini-like-btn like-btn">👍 ${Number(item.likes) || 0}</button>
                            <button type="button" class="mini-order-btn order-btn">طلب</button>
                        </div>
                    </div>
                `;

                card.querySelector(".like-btn").addEventListener("click", async () => {
                    item.likes = (Number(item.likes) || 0) + 1;
                    renderVendors();
                    if (db && !String(item.id).startsWith("demo-")) {
                        try {
                            await updateDoc(doc(db, "listings", String(item.id)), { likes: increment(1) });
                        } catch (e) {}
                    }
                });

                card.querySelector(".order-btn").addEventListener("click", () => {
                    const digits = String(item.orderWhatsapp || item.phone || "").replace(/\D/g, "");
                    if (digits.length >= 7) {
                        const intl = digits.startsWith("964") ? digits : (digits.startsWith("0") ? "964" + digits.slice(1) : "964" + digits);
                        const text = encodeURIComponent(`مرحباً، أنا زبون أتيتك من تطبيق سهل الوصول بخصوص: ${item.name || ""}`);
                        window.open(`https://wa.me/${intl}?text=${text}`, "_blank");
                    } else {
                        showToast(`الجهة: ${item.name || ""} — العنوان: ${item.address || "غير محدد"}`);
                    }
                });

                vendorsList.appendChild(card);
            });
        }

        function renderAdminManageList() {
            const box = document.getElementById("adminListingsManage");
            if (!box) return;
            if (!allItems.length) {
                box.innerHTML = '<p style="font-size:12px; color:var(--text-sub);">لا توجد إعلانات.</p>';
                return;
            }
            box.innerHTML = "";
            allItems.forEach((item) => {
                const row = document.createElement("div");
                row.style.cssText = "background:#f9fafb; border:1px solid #e5e7eb; border-radius:9px; padding:8px; margin-bottom:7px; font-size:12px;";
                row.innerHTML = `
                    <div><b>${esc(item.name)}</b> — <span style="color:#4b5563;">${esc(item.status || "approved")}</span></div>
                    <div style="color:#4b5563; font-size:11px; margin:3px 0 6px;">${esc(item.category || "")} • ${esc(item.address || "")}</div>
                    <div style="display:flex; gap:6px;">
                        <button type="button" class="mini-order-btn approve-btn">اعتماد</button>
                        <button type="button" class="mini-like-btn del-btn" style="color:#dc2626; border-color:#fecaca; background:#fef2f2;">حذف</button>
                    </div>
                `;
                row.querySelector(".approve-btn").addEventListener("click", async () => {
                    item.status = "approved";
                    renderVendors();
                    renderAdminManageList();
                    if (db && !String(item.id).startsWith("demo-")) {
                        try { await updateDoc(doc(db, "listings", String(item.id)), { status: "approved" }); } catch (e) {}
                    }
                });
                row.querySelector(".del-btn").addEventListener("click", async () => {
                    allItems = allItems.filter((x) => x.id !== item.id);
                    renderVendors();
                    renderAdminManageList();
                    if (db && !String(item.id).startsWith("demo-")) {
                        try { await deleteDoc(doc(db, "listings", String(item.id))); } catch (e) {}
                    }
                });
                box.appendChild(row);
            });
        }

        function openCommunityModal(mode) {
            communityMode = mode;
            const titleEl = document.getElementById("communityModalTitle");
            const txtInput = document.getElementById("commTextInput");
            const listBox = document.getElementById("communityItemsBox");
            if (mode === "charity") {
                titleEl.textContent = "🤝 رفّ الخير والمستعمل";
                txtInput.placeholder = "اسم الغرض أو التبرع...";
            } else {
                titleEl.textContent = "⚡ الطلبات السريعة (24 ساعة)";
                txtInput.placeholder = "اكتب الغرض أو الخدمة المطلوبة...";
            }
            const sourceArr = mode === "charity" ? charityItems : quickRequests;
            listBox.innerHTML = sourceArr.length
                ? sourceArr.map((x) => `<div style="padding:7px; border:1px solid #e5e7eb; border-radius:8px; margin-bottom:6px; font-size:11.5px;"><b>${esc(x.text)}</b>${x.phone ? `<div style="color:#4b5563;">📞 ${esc(x.phone)}</div>` : ""}</div>`).join("")
                : '<p style="font-size:11.5px; color:var(--text-sub); text-align:center;">لا توجد عناصر مضافة بعد.</p>';
            setModalOpen(communityModal, true);
        }

        // ربط جميع الأزرار والتبويبات مباشرة
        document.querySelectorAll(".top-tab-item").forEach((tab) => {
            tab.addEventListener("click", () => {
                document.querySelectorAll(".top-tab-item").forEach((t) => t.classList.remove("active"));
                tab.classList.add("active");
                const mode = tab.dataset.tab;
                if (mode === "homejobs") {
                    setActiveCategoryChip("شغل بيوت");
                } else if (mode === "requests") {
                    openCommunityModal("requests");
                } else if (mode === "charity") {
                    openCommunityModal("charity");
                } else {
                    setActiveCategoryChip("all");
                }
            });
        });

        document.querySelectorAll(".cat-chip").forEach((chip) => {
            chip.addEventListener("click", () => setActiveCategoryChip(chip.dataset.cat));
        });

        document.getElementById("searchInput").addEventListener("input", renderVendors);
        document.getElementById("searchGoBtn").addEventListener("click", renderVendors);
        document.getElementById("quickReqIcon").addEventListener("click", () => openCommunityModal("requests"));
        document.getElementById("installGuideIcon").addEventListener("click", () => {
            showToast("من قائمة المتصفح (⋮) اختر: إضافة إلى الشاشة الرئيسية");
        });

        document.getElementById("toggleFormBtn").addEventListener("click", () => {
            addFormContainer.style.display = addFormContainer.style.display === "block" ? "none" : "block";
        });
        document.getElementById("closeFormBtn").addEventListener("click", () => {
            addFormContainer.style.display = "none";
        });

        document.getElementById("submitListingBtn").addEventListener("click", async () => {
            const name = document.getElementById("reqName").value.trim();
            if (!name) {
                showToast("يرجى إدخال اسم المحل أو صاحب المشروع.");
                return;
            }
            const entry = {
                name,
                orderWhatsapp: document.getElementById("reqOrderWhatsapp").value.trim(),
                category: document.getElementById("reqCat").value,
                address: document.getElementById("reqAddress").value.trim(),
                price: document.getElementById("reqPrice").value.trim(),
                status: isAdmin ? "approved" : "pending",
                likes: 0,
                createdAt: Date.now()
            };

            try {
                if (db) {
                    const ref = await addDoc(collection(db, "listings"), entry);
                    entry.id = ref.id;
                } else {
                    entry.id = "local-" + Date.now();
                }
                allItems.unshift(entry);
                renderVendors();
                if (isAdmin) renderAdminManageList();
                document.getElementById("reqName").value = "";
                document.getElementById("reqOrderWhatsapp").value = "";
                document.getElementById("reqAddress").value = "";
                document.getElementById("reqPrice").value = "";
                addFormContainer.style.display = "none";
                showToast(isAdmin ? "تم نشر الإعلان مباشرة ✅" : "تم إرسال الطلب بنجاح ✅");
            } catch (err) {
                showToast("تعذر الحفظ في قاعدة البيانات.");
            }
        });

        document.getElementById("closeCommunityModalBtn").addEventListener("click", () => setModalOpen(communityModal, false));
        document.getElementById("commSaveBtn").addEventListener("click", () => {
            const text = document.getElementById("commTextInput").value.trim();
            const phone = document.getElementById("commPhoneInput").value.trim();
            if (!text) return;
            if (communityMode === "charity") {
                charityItems.unshift({ text, phone });
            } else {
                quickRequests.unshift({ text, phone });
            }
            document.getElementById("commTextInput").value = "";
            document.getElementById("commPhoneInput").value = "";
            openCommunityModal(communityMode);
            showToast("تمت الإضافة بنجاح ✅");
        });

        document.querySelectorAll(".bottom-nav-btn").forEach((btn) => {
            btn.addEventListener("click", () => {
                document.querySelectorAll(".bottom-nav-btn").forEach((b) => b.classList.remove("active"));
                btn.classList.add("active");
                const nav = btn.dataset.nav;
                if (nav === "admin") {
                    adminLoginError.textContent = "";
                    setModalOpen(adminModal, true);
                } else if (nav === "requests") {
                    openCommunityModal("requests");
                } else if (nav === "charity") {
                    openCommunityModal("charity");
                } else if (nav === "categories") {
                    document.querySelector(".categories-strip").scrollIntoView({ behavior: "smooth" });
                } else {
                    setActiveCategoryChip("all");
                }
            });
        });

        document.getElementById("closeAdminModalBtn").addEventListener("click", () => setModalOpen(adminModal, false));

        document.getElementById("adminLoginBtn").addEventListener("click", async () => {
            adminLoginError.textContent = "";
            const email = document.getElementById("adminEmailInput").value.trim();
            const pass = document.getElementById("adminPasswordInput").value;
            if (!auth) {
                adminLoginError.textContent = "تعذر تهيئة المصادقة حالياً.";
                return;
            }
            if (!email || !pass) {
                adminLoginError.textContent = "يرجى إدخال البريد الإلكتروني وكلمة المرور.";
                return;
            }
            if (email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
                adminLoginError.textContent = "هذا البريد غير مخول للإدارة.";
                return;
            }
            try {
                await signInWithEmailAndPassword(auth, email, pass);
                document.getElementById("adminPasswordInput").value = "";
            } catch (err) {
                adminLoginError.textContent = "تعذر الدخول: تأكد من البريد وكلمة المرور وتفعيل Email/Password في Firebase.";
            }
        });

        document.getElementById("adminLogoutBtn").addEventListener("click", async () => {
            if (auth) await signOut(auth);
        });

        async function loadRemoteListings() {
            if (!db) return;
            const snap = await getDocs(collection(db, "listings"));
            const remote = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
            allItems = remote.length ? remote : DEMO_LISTINGS.slice();
            renderVendors();
            if (isAdmin) renderAdminManageList();
        }

        async function startApp() {
            renderVendors();
            try {
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                onAuthStateChanged(auth, async (user) => {
                    const ok = Boolean(user && user.email && user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase());
                    if (user && !ok) {
                        await signOut(auth);
                        return;
                    }
                    isAdmin = ok;
                    adminLoginView.style.display = isAdmin ? "none" : "block";
                    adminDashboardView.style.display = isAdmin ? "block" : "none";
                    renderVendors();
                    if (isAdmin) renderAdminManageList();
                });

                await loadRemoteListings();
                statusStrip.textContent = "تم تحميل المحلات والخدمات بنجاح.";
            } catch (err) {
                console.warn("Firebase init note:", err);
                statusStrip.textContent = "الواجهة جاهزة — تحقق من قواعد Firestore أو الاتصال بالشبكة.";
            }
        }

        startApp();
    </script>
</body>
</html>
